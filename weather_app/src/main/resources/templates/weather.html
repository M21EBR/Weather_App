<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather</title>
</head>
<body>

<h1>
    Weather in
    <span th:text="${city}">city</span>,
    <span th:text="${country}"> country</span>
</h1>
<p>Temperature: <span th:text="${temperature}">0</span> °C</p>
<p>Condition: <span th:text="${weatherDescription}"> clear sky</span></p>
</body>
</html>
